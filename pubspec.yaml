name: streetride
description: StreetRide — Nigerian ride-hailing app.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # HTTP
  dio: ^5.7.0

  # Fonts & UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Location & Maps
  geolocator: ^13.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  permission_handler: ^11.3.1

  # Background & Notifications
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.2.4
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/streetride4.jpeg"
  adaptive_icon_background: "#FFC61A"
  adaptive_icon_foreground: "assets/images/streetride4.jpeg"
  min_sdk_android: 21
